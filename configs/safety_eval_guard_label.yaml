defaults:
  - dataset: ours
  - guard_model: llama-guard-4-12b
  - vllm_offline_chat
  - _self_

# Must match the output directory used for response generation (model ``short_name`` by default).
target_model_name: Qwen3-VL-2B-Instruct

sampling_params:
  temperature: 0.0
  max_new_tokens: 20

overwrite: false
response_path: null
save_path: null
checkpoint_name: base
result_suffix: null
guard_safety_labels_use_cache: false

# Server mode (python -m safety_eval.guard_label): reads ``get_response_path``, writes ``get_guard_save_path`` (same as batch).
server:
  host: 127.0.0.1
  port: 8000
base_url: http://${server.host}:${server.port}/v1
batch_size: 1
