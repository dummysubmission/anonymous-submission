defaults:
  - _self_

model_name: gemini-3-flash-preview

base_url: null

server:
  host: 127.0.0.1
  port: 8000

enable_thinking: false

# Only ``m3risk`` is supported (requires ``malicious_intent``). Default if unset.
benchmark: m3risk

save_path: null

start_index: 0
max_samples: null
# Capped at ``dataset_tagging.tag.MAX_TAXONOMY_TAG_ATTEMPTS`` (3): parse failures or out-of-taxonomy tags retry.
max_attempts_per_sample: 3
retry_sleep_seconds: 2.0

temperature: 0.7
overwrite: false
verbose: true

sampling_params:
  temperature: 0.7
  top_p: 1.0
  max_new_tokens: 65536
