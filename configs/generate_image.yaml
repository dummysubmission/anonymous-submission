defaults:
  - _self_

# Folder name under output/generate_sample/<source_model_name>/samples.json
source_model_name: Qwen3.5-9B-Instruct

# When set (repo-relative or absolute), load Stage-2 JSON from this file instead of
# output/generate_sample/<source_model_name>/samples.json (e.g. batched chunks
# samples_0-1000.json). When samples_save is null, curated output is
# data/ours_iter_3/<source_model_name>/<basename(samples_source)>.
samples_source: null
samples_save: null

start_index: 0
max_samples: null

# Skip samples that already have a non-empty image_path and the file exists on disk.
skip_existing: true

# Stop the whole run if one sample fails (otherwise log and continue).
strict: false

image_gen_model_path:

# Number of prompts per ``pipe`` call (higher throughput, more VRAM). Set to 1 to disable batching.
batch_size: 4

height: 1024
width: 1024
guidance_scale: 1.0
num_inference_steps: 4

device: cuda
dtype: bfloat16

# Base seed; when per_index_seed is true, each sample uses (seed + index).
seed: 0
per_index_seed: true
