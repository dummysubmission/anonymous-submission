defaults:
  - model: qwen3-vl-2b-instruct
  - vllm_offline_chat
  - _self_

# Only ``m3risk`` is supported.
benchmark: m3risk

save_path: null

start_index: 0
max_samples: null
overwrite: false
# Offline path retries up to ``dataset_tagging.tag.MAX_TAXONOMY_TAG_ATTEMPTS`` (3) per sample on bad JSON or invalid taxonomy.
verbose: true
enable_thinking: false

temperature: 0.7

sampling_params:
  temperature: 0.7
  top_p: 1.0
  max_new_tokens: 65536
