[project]
name = "mslm-distillation-safety"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datasets>=2.20.0",
  "google-genai>=1.60.0",
  "hydra-core>=1.3.2",
  "pandas>=2.3.3",
  "pillow>=12.0.0",
  "requests>=2.32.1",
  "standard-imghdr>=3.13.0",
  "streamlit>=1.53.1",
  "transformers==5.3.0",
  "torch",
  "torchvision",
  "portkey-ai>=2.1.0",
  "python-dotenv>=1.2.1",
  "trl>=0.27.1",
  "peft>=0.18.1",
  "liger-kernel>=0.6.4",
  "deepspeed>=0.18.5",
  "openai>=2.16.0",
  "ipykernel>=7.2.0",
  "plotly>=6.5.2",
  "nbformat>=5.10.4",
  "kaleido>=1.2.0",
  "sentence-transformers>=5.2.3",
  "nltk>=3.9.3",
  "typing-extensions>=4.15.0",
  "vllm==0.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]


# PyTorch CUDA 12.6 wheels live on PyTorch's own index, not PyPI.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.uv.sources]
# Force these packages to be resolved from the CUDA 12.6 PyTorch wheel index,
# otherwise uv may pull CPU / other CUDA builds from PyPI.
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
